# Host tools execute from this depset, while tenant builds execute in a Linux/musl microVM.
# Include both host-native and guest-native optional packages on macOS, Windows, and Linux hosts.
supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl

# pnpm 11 repairs node_modules against the lockfile before running any script. A template is
# developed against a local yalc overlay whose pins are deliberately kept out of source control, so
# that repair silently reinstalls the published package over the linked one — and `bolt sync` then
# regenerates this template's client from a stale bundle while reporting success. Installing stays
# explicit: `pnpm install` still reconciles, and `pnpm env -- retreat` from the realm root
# restores the registry versions.
verifyDepsBeforeRun: false
