allowBuilds:
  esbuild: true
  isolated-vm: true
  msgpackr-extract: false

# The root installs `@norbital-ai/bolt` for `bolt templates` (no template carries
# it; `bolt check` type-checks with each template's own Bolt). Like every template's
# own policy, only these exact, reviewed first-party releases bypass the minimum-release-age gate.
minimumReleaseAgeExclude:
  - '@norbital-ai/app-shell@0.0.8'
  - '@norbital-ai/bolt@0.0.8'
  - '@norbital-ai/bolt-server@0.0.8'
  - '@norbital-ai/doctor@0.0.8'
  - '@norbital-ai/providers@0.0.8'
  - '@norbital-ai/std@0.0.8'
  - '@norbital-ai/store@0.0.8'
  - '@norbital-ai/ui@0.0.8'

# As in every template: pnpm 11 would reinstall the published Bolt over a local overlay before
# running any script, so `pnpm templates:*` would run the registry's `bolt` instead of the linked one.
verifyDepsBeforeRun: false

overrides:
  # Hold platform-node's shared package on the pinned Effect release.
  # One Effect release line in the graph: the published first-party 0.0.6 packages still pin rc.112.
  effect: 4.0.6
  '@effect/platform-node': 4.0.6
  '@effect/platform-node-shared': 4.0.6
  '@effect/vitest': 4.0.6

packageExtensions:
  # GitHub Packages omits optional peer metadata from registry responses.
  '@norbital-ai/bolt':
    peerDependenciesMeta:
      svelte2tsx:
        optional: true
      typescript:
        optional: true
