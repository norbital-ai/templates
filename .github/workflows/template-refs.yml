name: Publish template refs

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: template-refs-${{ github.ref }}
  cancel-in-progress: true

# `packages: read` resolves the published `@norbital-ai/*` versions a template pins, the same
# reason the CI workflow grants it.
permissions:
  contents: write
  packages: write

env:
  NORBITAL_PACKAGE_REGISTRY: ${{ vars.NORBITAL_PACKAGE_REGISTRY || 'https://npm.pkg.github.com' }}

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      # `git subtree split` walks the history of each template directory, so a shallow checkout
      # would project a different commit than the one already published and break fast-forward.
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@norbital-ai'

      - name: Install repository tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate template declarations
        run: pnpm templates:check

      - name: Validate template package policies
        run: pnpm test

      - name: Resolve projected revisions
        run: |
          node scripts/project-templates.mjs \
            --source-revision "$GITHUB_SHA" \
            --repository "$SOURCE_REPOSITORY_URL" \
            --output dist/template-revisions.json
        env:
          SOURCE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git

      # Build the exact standalone projections and package their output before any public ref moves.
      # A failed build or upload therefore leaves every existing template ref usable.
      - name: Validate projections and prepare canonical build bundles
        run: |
          node scripts/validate-template-projections.mjs \
            --revisions dist/template-revisions.json \
            --bundle-output dist/template-bundles
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # Bundle packages use the canonical 0.0.1 version. An existing byte-identical build is safe to
      # skip; a different build fails before refs move because package versions cannot be overwritten.
      - name: Publish canonical build bundles
        run: node scripts/publish-template-bundles.mjs dist/template-bundles
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # The atomic ref update is deliberately last: no consumer of a projected ref ever observes a
      # source revision whose exact prebuilt bundle is absent from the registry.
      - name: Publish root template refs
        run: |
          node scripts/project-templates.mjs \
            --source-revision "$GITHUB_SHA" \
            --push origin

      - name: Upload resolved template revisions
        uses: actions/upload-artifact@v7
        with:
          name: template-revisions-${{ github.sha }}
          path: dist/template-revisions.json
          if-no-files-found: error
          retention-days: 30
