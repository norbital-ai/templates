name: Publish template refs

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: template-refs-${{ github.ref }}
  cancel-in-progress: true

# `packages: read` resolves the published `@norbital-ai/*` versions a template pins, the same
# reason the CI workflow grants it.
permissions:
  contents: write
  packages: read

env:
  NORBITAL_PACKAGE_REGISTRY: ${{ vars.NORBITAL_PACKAGE_REGISTRY || 'https://npm.pkg.github.com' }}

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      # `git subtree split` walks the history of each template directory, so a shallow checkout
      # would project a different commit than the one already published and break fast-forward.
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@norbital-ai'

      - name: Install repository tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate template declarations
        run: pnpm templates:check

      - name: Validate template package policies
        run: pnpm test

      - name: Resolve projected revisions
        run: |
          node --experimental-strip-types scripts/ci.ts publish \
            --source-revision "$GITHUB_SHA" \
            --repository "$SOURCE_REPOSITORY_URL" \
            --output "$RUNNER_TEMP/template-revisions.json"
        env:
          SOURCE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git

      # Sync the exact standalone projections before any public ref moves. A failed compile leaves
      # every existing template ref usable.
      - name: Validate standalone projections
        run: node --experimental-strip-types scripts/ci.ts verify
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # The atomic ref update is deliberately last: no consumer observes source that failed its
      # standalone compile and lint gates. Preview builds the exact selected commit on demand.
      - name: Publish root template refs
        run: |
          node --experimental-strip-types scripts/ci.ts publish \
            --source-revision "$GITHUB_SHA" \
            --push origin

      - name: Upload resolved template revisions
        uses: actions/upload-artifact@v7
        with:
          name: template-revisions-${{ github.sha }}
          path: ${{ runner.temp }}/template-revisions.json
          if-no-files-found: error
          retention-days: 30
