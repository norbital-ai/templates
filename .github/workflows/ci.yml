name: CI

# One workflow, one verdict: `check` is the same `pnpm check` a person runs locally, and on `main` the template refs
# publish from that verdict — nothing is checked twice.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `packages: read` lets every template resolve the published `@norbital-ai/*` versions its own
# manifest pins. Templates are not workspace members and link nothing locally, so the registry is
# the only place these come from — here exactly as in a tenant sandbox.
permissions:
  contents: read
  packages: read

env:
  NORBITAL_PACKAGE_REGISTRY: ${{ vars.NORBITAL_PACKAGE_REGISTRY || 'https://npm.pkg.github.com' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history: projections verify only the templates changed since the base, and that needs the base.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@norbital-ai'

      # The tooling is `bolt templates`, so the root pins `@norbital-ai/bolt` from the registry too.
      - name: Install repository tooling
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # Declarations, formatting and every committed lock (each is release authority, so all are re-resolved), then
      # each changed template as a tenant receives it: its tracked files alone, installed offline from its lock, built
      # and tested. Repository variable SKIP_CI_TESTS=true (owner, 2026-10-21: the suites ran locally) keeps only
      # the static half.
      - name: Check templates
        run: pnpm ${{ vars.SKIP_CI_TESTS == 'true' && 'check:static' || 'check' }}
        env:
          NORBITAL_TEMPLATES_SINCE: ${{ github.event.pull_request.base.sha || github.event.before || 'all' }}
          # /tmp is a small tmpfs; projections and their installs live on the runner's disk
          TMPDIR: ${{ runner.temp }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      # `git subtree split` walks the history of each template directory, so a shallow checkout
      # would project a different commit than the one already published and break fast-forward.
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@norbital-ai'

      - name: Install repository tooling
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # The atomic ref update is last and runs only on `check`'s verdict: no consumer observes source that failed it.
      # Preview builds the exact selected commit on demand.
      - name: Publish template refs
        run: |
          pnpm exec bolt templates publish \
            --source-revision "$GITHUB_SHA" \
            --repository "$SOURCE_REPOSITORY_URL" \
            --output "$RUNNER_TEMP/template-revisions.json" \
            --push origin
        env:
          SOURCE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git

      - name: Upload resolved template revisions
        uses: actions/upload-artifact@v7
        with:
          name: template-revisions-${{ github.sha }}
          path: ${{ runner.temp }}/template-revisions.json
          if-no-files-found: error
          retention-days: 30
